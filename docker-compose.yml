services:
  csi:
    build: .
    image: csi-rig:latest
    # The whole repo at one mount point. The previous layout had three overlapping
    # mounts and tools that guessed which one they were under; one root removes the
    # guessing and makes every in-container path predictable.
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Full /dev, not per-device entries: any current or future ttyACMx / videoN
      # node is then visible without editing this file or restarting for a replug.
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    device_cgroup_rules:
      # The bind mount above makes device nodes visible, not usable. These grant the
      # classes we need: USB-serial (166) for the boards, video4linux (81) plus the
      # media-controller nodes (234) for the RealSense. 234 is a dynamic major -- if
      # the camera stops being found after a kernel change, check `ls -l /dev/media0`.
      - 'c 166:* rmw'
      - 'c 81:* rmw'
      - 'c 234:* rmw'
    environment:
      - DISPLAY=${DISPLAY}
    stdin_open: true
    tty: true

  # GPU side: NLF + SMPL fit + YOLO + dataset builders (Dockerfile.pose). The
  # recordings mount at /workspace/data from $CSI_DATA (default ./data), so
  # `CSI_DATA=~/Downloads docker compose run --rm pose ...` works off a copy.
  pose:
    build:
      context: .
      dockerfile: Dockerfile.pose
    image: csi-pose:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
      - ${CSI_DATA:-./data}:/workspace/data
    # `runtime: nvidia` is the passthrough that works with nvidia-container-toolkit
    # as configured in /etc/docker/daemon.json; the CDI / `gpus:` route left CUDA
    # with "unknown error" on the 2026-09-17 workstation.
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    stdin_open: true
    tty: true
