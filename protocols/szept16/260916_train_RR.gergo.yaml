# Capture protocol — balazs, train split, SINGLE TRANSMITTER (B).
#
# Pin B in the viewer's Transmitter bar before running. Only B->A, B->C
# and B->D exist in this configuration; the other 9 links are not idle,
# they do not exist, so these recordings are 3-link and NOT interchangeable
# with the 12-link round-robin corpus. Each link runs ~105 Hz instead of
# ~26 Hz, because every ping now serves 3 links rather than 12.
#
# Pick it with the "Protocol…" button in the viewer, or:
#   python3 live_viewer.py --protocol protocols/balazs_train_txB.yaml
#
# Timing applies to every take:
#   lead_in   seconds of "get ready" before recording starts
#   duration  seconds actually recorded
#   gap       seconds of rest after recording, before the next take's lead-in
#
# Takes are written to data/balazs_train_txB/<take name>.npz plus a matching _frames/
# directory, so one session's files stay together.
#
# The set is cycled, not each take repeated back to back: you get salute0,
# 2handwave0 ... then salute1, 2handwave1 ... so repeats of one activity land
# minutes apart rather than seconds, which makes them far more independent samples.
# 10 rounds x 5 activities = 50 takes, about 8 min.
lead_in: 4
duration: 7
gap: 0

repeats: 5

takes:
  - name: right_wave
    instruction: WAVE WITH RIGHT HAND - Integess a jobb kezeddel

  - name: left_wave
    instruction: WAVE WITH LEFT HAND - Integess a bal kezeddel

  - name: stretch_horizontal
    instruction: STRETCH HORIZONTAL — Melkas nyújtás

  - name: hand_on_neck
    instruction: HAND ON NECK - Kezek a tarkóra

  - name: arms_forward
    instruction: ARMS FORWARD — Nyújtsd ki előre a kezeidet
  - name: idle
    instruction: MOVE TO THE NEXT MARK - Lépj a következő jelölőre
